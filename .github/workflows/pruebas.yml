name: Pruebas unitarias e integración

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  pruebas:
    name: Pruebas y cubrimiento
    runs-on: ubuntu-latest
    outputs:
      salida: ${{ steps.validar.outputs.respuesta }}
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v2

      - name: Configuración de entorno de Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Instalación de librerías y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr pruebas
        id: correr-pruebas
        run: python -m pytest -v

      - name: Validar resultado con errores
        id: validar-error
        if: ${{ failure() }}
        env:
          MENSAJE_ERROR: Una o varias pruebas fallaron
        run: echo "::set-output name=respuesta::${MENSAJE_ERROR}"

      - name: Validar resultado sin errores
        id: validar
        if: ${{ success() }}
        env:
          MENSAJE_EXITO: Todas las pruebas fueron exitosas
        run: echo "::set-output name=respuesta::${MENSAJE_EXITO}"

      - name: Cálculo de cubrimiento
        id: cubrimiento
        run: |
          coverage run -m pytest
          coverage report -m
          coverage xml

      - name: Publicar reporte de cubrimiento
        if: ${{ always() }}
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

  mensaje:
    name: Mensaje del resultado
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir resultado
        run: echo ${{ needs.pruebas.outputs.salida }}
